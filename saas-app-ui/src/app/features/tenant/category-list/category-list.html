<p-toast position="top-right" />
<div>
  <h1>Category List</h1>
  <div class="flex justify-content-end">
    <p-button label="Add category" icon="pi pi-plus" (onClick)="addCategory()"/>
  </div>
  <div class="card">
    @if (categories && categories.length > 0) {
        <p-table [value]="categories" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <i class="pi pi-spin pi-cog" style="font-size: 2rem"></i>
        </tr>
      </ng-template>
      <ng-template #body let-category>
        <tr>
          <td>{{ category.name }}</td>
          <td>{{ category.description }}</td>
          <td>
            <div class="flex justify-content-center gap-2">
                 <i (click)="updateCategory(category.id)" class="curor-pointer pi pi-file-edit" style="color: blue" pTooltip="Update Category"></i>
                 <i (click)="deleteCategory(category.id)" class="curor-pointer pi pi-trash" style="color: red" pTooltip="Delete Category"></i>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
    } @else {
        <h1>No content</h1>
    }
  </div>
</div>
