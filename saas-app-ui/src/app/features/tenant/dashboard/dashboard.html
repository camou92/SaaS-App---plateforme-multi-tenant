<div class="tenant-layout">

  <!-- ─── Sidebar ────────────────────────────────────────────────────────── -->
  <aside class="tenant-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="pi pi-box"></i></div>
      <span class="brand-name">StockFlow</span>
    </div>

    <div class="sidebar-section-label">Workspace</div>

    <nav class="sidebar-nav">
      <div class="nav-item" (click)="navigateTo('d')">
        <i class="pi pi-chart-bar"></i>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" (click)="navigateTo('p')">
        <i class="pi pi-box"></i>
        <span>Products</span>
      </div>
      <div class="nav-item" (click)="navigateTo('c')">
        <i class="pi pi-tag"></i>
        <span>Categories</span>
      </div>
      <div class="nav-item" (click)="navigateTo('s')">
        <i class="pi pi-list"></i>
        <span>Stock Movements</span>
      </div>
      <div class="nav-item" (click)="navigateTo('u')">
        <i class="pi pi-users"></i>
        <span>Users</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar"><i class="pi pi-user"></i></div>
        <div class="user-details">
          <span class="user-name">Company Admin</span>
          <span class="user-role">Tenant Manager</span>
        </div>
      </div>
      <p-button
        label="Logout"
        icon="pi pi-power-off"
        variant="text"
        severity="danger"
        [style]="{'width': '100%', 'justify-content': 'flex-start'}"
        (onClick)="logout()"
      />
    </div>
  </aside>

  <!-- Child route content -->
  <div class="tenant-content">
    <router-outlet />
  </div>
</div>
