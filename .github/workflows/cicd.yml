name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. DETECT CHANGES
  # ============================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'saas-app-ui/**'

            backend:
              - 'saas-app/**'


  # ============================================================
  # 2. FRONTEND - BUILD & PUSH
  # ============================================================
  frontend:
    name: Build & Push Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./saas-app-ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/multy-tenancy-frontend-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/multy-tenancy-frontend-ui:latest


  # ============================================================
  # 3. BACKEND - BUILD & PUSH
  # ============================================================
  backend:
    name: Build & Push Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./saas-app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-saas-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-saas-app:latest


  # ============================================================
  # 4. UPDATE KUBERNETES MANIFESTS
  # ============================================================
  update-manifests:
    name: Update Kubernetes manifests

    needs:
      - changes
      - frontend
      - backend

    if: |
      always() &&
      (
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # FRONTEND
      # --------------------------------------------------------
      - name: Update frontend image
        if: needs.changes.outputs.frontend == 'true'
        run: |
          sed -i \
            "s#image: .*multy-tenancy-frontend-ui:.*#image: ${{ secrets.DOCKERHUB_USERNAME }}/multy-tenancy-frontend-ui:${{ github.sha }}#" \
            k8s/frontend/deployment.yaml

      # --------------------------------------------------------
      # BACKEND
      # --------------------------------------------------------
      - name: Update backend image
        if: needs.changes.outputs.backend == 'true'
        run: |
          sed -i \
            "s#image: .*backend-saas-app:.*#image: ${{ secrets.DOCKERHUB_USERNAME }}/backend-saas-app:${{ github.sha }}#" \
            k8s/backend/deployment.yaml

      # --------------------------------------------------------
      # GIT COMMIT + PUSH
      # --------------------------------------------------------
      - name: Commit and push manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes"
            exit 0
          fi

          git commit -m "chore: update container images to ${{ github.sha }}"

          git push
