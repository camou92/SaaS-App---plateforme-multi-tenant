```yaml
name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. DETECT CHANGES
  # ============================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'saas-app-ui/**'

            backend:
              - 'saas-back/**'


  # ============================================================
  # 2. FRONTEND
  # ============================================================
  frontend:
    name: Build & Push Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./saas-app-ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/multy-tenancy-frontend-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/multy-tenancy-frontend-ui:latest

      - name: Update frontend Kubernetes manifest
        run: |
          sed -i \
            "s#image: .*multy-tenancy-frontend-ui:.*#image: ${{ secrets.DOCKERHUB_USERNAME }}/multy-tenancy-frontend-ui:${{ github.sha }}#" \
            k8s/frontend/deployment.yaml

      - name: Commit frontend manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/frontend/deployment.yaml

          git diff --cached --quiet || \
          git commit -m "chore: update frontend image to ${{ github.sha }}"

          git push


  # ============================================================
  # 3. BACKEND
  # ============================================================
  backend:
    name: Build & Push Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./saas-app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-saas-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-saas-app:latest

      - name: Update backend Kubernetes manifest
        run: |
          sed -i \
            "s#image: .*backend-saas-app:.*#image: ${{ secrets.DOCKERHUB_USERNAME }}/backend-saas-app:${{ github.sha }}#" \
            k8s/backend/deployment.yaml

      - name: Commit backend manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend/deployment.yaml

          git diff --cached --quiet || \
          git commit -m "chore: update backend image to ${{ github.sha }}"

          git push
```
