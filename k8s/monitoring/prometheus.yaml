apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: saas-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest

          ports:
            - containerPort: 9090

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml

            - name: prometheus-rules
              mountPath: /etc/prometheus/alert.rules.yml
              subPath: alert.rules.yml

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

        - name: prometheus-rules
          configMap:
            name: prometheus-alert-rules

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: saas-app
spec:
  selector:
    app: prometheus

  ports:
    - port: 9090
      targetPort: 9090