apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: saas-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:main

          args:
            - "-config.file=/etc/loki/local-config.yaml"

          ports:
            - containerPort: 3100

          volumeMounts:
            - name: config
              mountPath: /etc/loki/local-config.yaml
              subPath: local-config.yaml

      volumes:
        - name: config
          configMap:
            name: loki-config

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: saas-app
spec:
  selector:
    app: loki

  ports:
    - port: 3100
      targetPort: 3100