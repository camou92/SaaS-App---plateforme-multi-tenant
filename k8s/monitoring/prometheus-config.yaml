apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: saas-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: postgres
        static_configs:
          - targets:
              - postgres-exporter:9187

      - job_name: saas-back
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - saas-back:8080

      - job_name: saas-back-blackbox
        metrics_path: /probe

        params:
          module:
            - http_2xx

        static_configs:
          - targets:
              - http://saas-back:8080/actuator/health

        relabel_configs:
          - source_labels:
              - __address__
            target_label: __param_target

          - source_labels:
              - __param_target
            target_label: instance

          - target_label: __address__
            replacement: blackbox-exporter:9115