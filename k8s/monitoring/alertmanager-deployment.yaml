apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: saas-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest

          ports:
            - containerPort: 9093

          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml

            - name: smtp-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: alertmanager-config

        - name: smtp-secret
          secret:
            secretName: alertmanager-smtp

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: saas-app
spec:
  selector:
    app: alertmanager

  ports:
    - port: 9093
      targetPort: 9093