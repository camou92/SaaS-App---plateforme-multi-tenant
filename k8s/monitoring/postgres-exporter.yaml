apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: saas-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest

          ports:
            - containerPort: 9187

          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:postgres@postgres-saas:5432/saas-app-db?sslmode=disable"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: saas-app
spec:
  selector:
    app: postgres-exporter

  ports:
    - port: 9187
      targetPort: 9187