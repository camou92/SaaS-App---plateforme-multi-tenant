apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: saas-app
data:
  alert.rules.yml: |
    groups:
      - name: saas-back-alerts

        rules:

          - alert: SaaSBackDown
            expr: probe_success{job="saas-back-blackbox"} == 0
            for: 1m

            labels:
              severity: critical

            annotations:
              summary: "saas-back service is down"
              description: "Le service saas-back n'est pas accessible depuis plus d'une minute"

          - alert: PostgresDown
            expr: up{job="postgres"} == 0
            for: 1m

            labels:
              severity: critical

            annotations:
              summary: "Postgres service down"
              description: "PostgreSQL n'est pas accessible depuis plus d'une minute"

          - alert: SaaSBackHighLatency
            expr: rate(http_server_requests_seconds_sum{job="saas-back"}[5m]) > 0.5
            for: 5m

            labels:
              severity: warning

            annotations:
              summary: "Backend latency high"
              description: "Le backend saas-back présente une latence élevée"