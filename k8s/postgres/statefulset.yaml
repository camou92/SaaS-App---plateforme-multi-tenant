apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-saas
  namespace: saas-app
spec:
  serviceName: postgres-saas
  replicas: 1

  selector:
    matchLabels:
      app: postgres-saas

  template:
    metadata:
      labels:
        app: postgres-saas

    spec:
      containers:
        - name: postgres
          image: postgres:17.5

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_NAME

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/data

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-saas-pvc