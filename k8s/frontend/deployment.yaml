apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: saas-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend-ui

  template:
    metadata:
      labels:
        app: frontend-ui

    spec:
      containers:
        - name: frontend-ui
          image: multy-tenancy-frontend-ui:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi