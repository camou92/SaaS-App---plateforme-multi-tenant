services:
  postgres-saas:
    image: postgres:17.5
    container_name: saas-db
    environment:
      POSTGRES_DB: ${DB_NAME:-saas-app-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/data
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_saas:/var/lib/postgresql/data/data
    networks:
      - saas-app-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saas-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saas.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - saas-app-network
    depends_on:
      - postgres-saas
    restart: unless-stopped

volumes:
  postgres_saas:
    driver: local
  pgadmin_data:
    driver: local

networks:
  saas-app-network:
    driver: bridge